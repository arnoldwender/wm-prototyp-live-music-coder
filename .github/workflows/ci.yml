name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test, Build & Prerender Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app & Electron
        run: |
          npx tsc -b
          npx tsc --noEmit -p tsconfig.node.json

      - name: Lint (zero warnings)
        run: npx eslint . --max-warnings=0

      - name: Unit & SSR tests
        run: npm run test -- --run

      - name: Mutation test llms.txt gate
        run: bash scripts/mutate-verify-llms-txt.sh

      - name: Production build + full-route prerender
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify SSR hydration across all routes
        run: npm run verify:hydration

      - name: Verify EU AI Act Art. 50 labels & asset hygiene
        run: npm run verify:ai-labels
