# Netlify build configuration for Vite SPA
# ──────────────────────────────────────────────────────────────────────
# Netlify builds `main` from GitHub on every push with the command below (checked 2026-10-04 in
# the Netlify API: repository linked, builds not stopped, the published deploy came from git).
# The note that stood here — continuous deployment disabled on 2026-04-13, production deployed by
# hand — no longer held. `npm run build` runs scripts/verify-llms-txt.mjs first (prebuild).
# ──────────────────────────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "22"

# Security headers — CSP, clickjacking, MIME sniffing protection
[[headers]]
  for = "/*"
  [headers.values]
    # unsafe-eval: required by Strudel live-coding engine (new Function / eval) — accepted risk by design
    # unsafe-inline (style-src): required by Tailwind CSS 4 utility classes + React style={{}} props — no nonce alternative
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' blob: data:; script-src-elem 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://*.githubusercontent.com https://freesound.org https://*.freesound.org; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob: data:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# SPA redirect — all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
